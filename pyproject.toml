[project]
name = "smolm-jp-4"
version = "0.1.0"
description = "350M Japanese language model with GDN+GQA hybrid architecture"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "flash-linear-attention>=0.5",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=0.25",
    "einops>=0.6",
]

[project.optional-dependencies]
train = [
    "wandb>=0.16",
    "numpy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
